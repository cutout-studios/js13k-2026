<meta charset=utf-8>
<style>
html,
body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #eee;
  font-family: Menlo, ui-monospace;
  font-size: 13px;
}
body {
  display: grid;
  grid-template-columns: auto 360px;
  width: 100vw;
  height: 100vh;
}
#stage {
  display: grid;
  place-items: center;
  background: #111;
}
canvas {
  background: #000;
  cursor: crosshair;
}
#panel {
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  background: #0a0a0a;
  border-left: 1px solid #333;
}
h2 {
  font-size: .75rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: #888;
  margin: 0 0 .5rem;
}
label {
  display: flex;
  flex-direction: column;
  gap: .25rem;
  font-size: .8rem;
  color: #aaa;
}
input[type=range] {
  width: 100%;
}
input[type=number],
select {
  width: 100%;
  background: #111;
  color: #eee;
  border: 1px solid #444;
  padding: .3rem;
  font: inherit;
}
.row {
  display: flex;
  gap: .5rem;
}
.row > label {
  flex: 1;
}
button {
  cursor: pointer;
  padding: .4rem .6rem;
  background: #111;
  color: #eee;
  border: 1px solid #444;
  font: inherit;
}
button:hover,
button:focus {
  border-color: #0f0;
  color: #0f0;
}
textarea {
  width: 100%;
  height: 4rem;
  background: #111;
  color: #6f6;
  border: 1px solid #444;
  font: inherit;
  resize: vertical;
}
#selected {
  color: #ff0;
}
</style>
<div id=stage>
  <canvas id=canvas width=512 height=512></canvas>
</div>
<div id=panel>
  <div>
    <h2>Preview</h2>
    <label>Progress
      <input type=range id=progress min=0 max=1 step=.01 value=1>
    </label>
    <label style="flex-direction:row; align-items:center; margin-top:.5rem">
      <input type=checkbox id=snap checked> Snap to nearby vertex
    </label>
  </div>
  <div>
    <h2>Selected vertex</h2>
    <div id=selected>none - click a point</div>
    <div class=row>
      <label>X <input type=number id=vertexX step=1></label>
      <label>Y <input type=number id=vertexY step=1></label>
    </div>
    <label>Color band
      <select id=band>
        <option value=0>1</option>
        <option value=1>2</option>
        <option value=2>3</option>
        <option value=3>4</option>
        <option value=4>5</option>
        <option value=5>6</option>
      </select>
    </label>
  </div>
  <div>
    <h2>Triangles</h2>
    <div class=row>
      <button id=addTriangle>Add triangle</button>
      <button id=deleteTriangle>Delete selected (Del)</button>
    </div>
  </div>
  <div>
    <h2>Finalize</h2>
    <div class=row>
      <button id=copyVertices>Copy VERTICES array</button>
      <button id=copyEncoded>Copy encoded string</button>
    </div>
    <textarea id=output readonly></textarea>
  </div>
</div>
