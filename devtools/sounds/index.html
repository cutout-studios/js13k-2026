<meta charset=utf-8>
<style>
html,
body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #eee;
  font-family: Menlo, ui-monospace;
  font-size: 13px;
}
body {
  display: grid;
  grid-template-columns: 280px 1fr;
  width: 100vw;
  height: 100vh;
}
#soundboard {
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: .5rem;
  background: #0a0a0a;
  border-right: 1px solid #333;
}
#editor {
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
h2 {
  font-size: .75rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: #888;
  margin: 0 0 .5rem;
}
.row {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  align-items: center;
}
button {
  cursor: pointer;
  padding: .4rem .6rem;
  background: #111;
  color: #eee;
  border: 1px solid #444;
  font: inherit;
}
button:hover,
button:focus {
  border-color: #0f0;
  color: #0f0;
}
select,
input[type=number] {
  background: #111;
  color: #eee;
  border: 1px solid #444;
  padding: .3rem;
  font: inherit;
}
input[type=number] {
  width: 4.5rem;
}
label {
  display: flex;
  align-items: center;
  gap: .3rem;
  color: #aaa;
}
.layer {
  border: 1px solid #333;
  padding: .75rem;
  display: flex;
  flex-direction: column;
  gap: .5rem;
}
.step {
  display: flex;
  gap: .4rem;
  align-items: center;
  flex-wrap: wrap;
  border-top: 1px solid #222;
  padding-top: .4rem;
}
textarea {
  width: 100%;
  height: 8rem;
  background: #111;
  color: #6f6;
  border: 1px solid #444;
  font: inherit;
  resize: vertical;
}
#play {
  background: #030;
  border-color: #0f0;
  color: #0f0;
  font-weight: bold;
}
</style>
<div id=soundboard>
  <h2>Sounds (click to play)</h2>
  <div class=row id=soundButtons></div>
</div>
<div id=editor>
  <h2>Build a sound</h2>
  <div class=row>
    <button id=play>▶ Play</button>
    <button id=addLayer>Add layer</button>
    <button id=copyCode>Copy code</button>
    <button id=copyPacked>Copy packed</button>
  </div>
  <div id=layers></div>
  <textarea id=output readonly></textarea>
</div>
